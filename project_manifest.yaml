architecture:
  diagram: "evidence/architecture-current.png"
  review: "evidence/serverless-zero-trust-review.md"
  service_model: "FaaS plus managed PaaS/serverless services, IaaS networking configuration, and SaaS delivery tooling"
  deployment_model: "Public cloud"
  service_models:
    faas: "AWS Lambda"
    managed_paas: "API Gateway, S3, DynamoDB, Cognito, Glue, Athena, Bedrock, CloudFront, WAF, CloudWatch, SNS, and KMS"
    iaas_networking: "Amazon VPC, private subnets, route tables, security groups, and VPC endpoints; no EC2"
    saas_tooling: "GitHub and GitHub Actions"
    container_note: "ECR stores the Lambda image; no CaaS runtime is deployed"
  components:
    - "Amazon CloudFront"
    - "AWS WAF"
    - "Amazon S3 private frontend origin"
    - "Amazon API Gateway HTTP API"
    - "AWS Lambda"
    - "Amazon VPC with two private subnets"
    - "Amazon VPC gateway and interface endpoints"
    - "Amazon Elastic Container Registry"
    - "Amazon Cognito"
    - "Amazon DynamoDB"
    - "Amazon S3 data lake"
    - "AWS Glue ETL and Data Catalog"
    - "Amazon Athena"
    - "Amazon Bedrock Claude Haiku 4.5"
    - "Amazon CloudWatch Logs"
    - "Amazon CloudWatch dashboard and alarms"
    - "Amazon SNS"
    - "AWS Key Management Service"
    - "AWS CloudTrail"
    - "GitHub Actions CI/CD"

evidence:
  cloud_verification: "evidence/cloud-verification-2026-10-06.md"
  pricing_calculator: "evidence/aws-pricing-calculator-2026-10-06.md"
  final_teardown: "evidence/teardown-2026-10-04.md"
  live_review: "evidence/application-live-review-2026-10-03.md"
  chatbot_accuracy: "evidence/chatbot-accuracy-2026-10-04.md"
  functional_test: "evidence/test-functional.md"
  security_test: "evidence/test-security.md"
  data_ai_test: "evidence/test-data-ai.md"
  scale_resilience_test: "evidence/test-resilience.md"
  monitoring: "evidence/monitoring.md"

data_ai:
  dataset: "data/README.md"
  method: "City-stratified price regression with log target transformation and histogram gradient boosting selected against median and ridge baselines"
  evaluation: "Selected median city-normalized MAE 0.592; pooled held-out MAE 191.836, RMSE 629.762 and R-squared 0.644 in mixed local-currency units; log-price R-squared 0.850; see per-city metrics and limitations"
  reproducible_command: "python tests/local_preflight.py --include-ml"
  full_dataset_reproducible_command: "python analytics/train_model.py --listings \"data/raw/Airbnb Data/Listings.csv\" --model-output analytics/artifacts/airbnb_price_model.joblib --metrics-output analytics/artifacts/model_evaluation.json"
  cloud_pipeline_evidence: "evidence/data-pipeline.md"

security:
  threat_control_map: "evidence/threat-control-map.md"
  owasp_top_10_review: "evidence/owasp-top-10-2025-review.md"
  secrets_handling: "No credentials are stored in source or Terraform variables; deployment uses the standard AWS credential chain and Lambda IAM roles."
  authentication: "Cognito authorization-code flow with PKCE, email verification, and required TOTP MFA; API Gateway JWT authorization derives history ownership from the verified subject claim and protects AI access."

run:
  prerequisites:
    - "Python 3.11 or newer"
    - "Node.js 24 for frontend syntax validation"
    - "Terraform 1.10 or newer"
    - "AWS CLI v2, Docker, and authorized AWS credentials only for cloud deployment"
  local_expected_cost: "USD 0; the synthetic-data website and test path require no cloud account"
  cloud_expected_cost: "About USD 72.92 per continuously deployed month before discounts and tax under the documented low-traffic assumptions; two-AZ interface endpoint hours dominate. See evidence/aws-pricing-calculator-2026-10-06.md"
  commands:
    - "python -m pip install -r tests/requirements.txt"
    - "terraform -chdir=src/infrastructure init -backend=false"
    - "python tests/local_preflight.py --include-ml"
    - "python src/local_server.py"
    - "python -m unittest discover -s tests -p test_*.py -v"
    - "terraform -chdir=src/infrastructure validate"
    - "terraform -chdir=src/infrastructure plan"

declarations:
  ai_use: "AI_USE_DECLARATION.md"
  contributions: "TEAM_CONTRIBUTIONS.md"
