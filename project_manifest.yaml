# INF2006 Team Project - machine-readable manifest (Appendix A schema).
# Teams may add fields but must NOT rename or remove the fields below.
# All paths are relative to the ZIP root and must point to real artefacts.

project:
  group_id: "G014"
  title: "Airbnb Pricing and Market Intelligence Platform"
  problem_statement: "Help prospective and existing Airbnb hosts compare listing configurations, estimate a reasonable nightly price, and understand surrounding historical market conditions before deciding whether hosting may suit a property."
  cloud_provider: "AWS"
  # A commit cannot contain its own hash, so this records the reviewed predecessor.
  repository_commit: "368b0cc"

