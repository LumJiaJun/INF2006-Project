# INF2006 Team Project - machine-readable manifest (Appendix A schema).
# Teams may add fields but must NOT rename or remove the fields below.
# All paths are relative to the ZIP root and must point to real artefacts.

project:
  group_id: "Gxxx"
  title: "Airbnb Pricing and Market Intelligence Platform"
  problem_statement: "Help Airbnb hosts interpret market patterns and estimate a reasonable nightly listing price."
  cloud_provider: "AWS"
  repository_commit: "optional commit hash"

team:
  members:
    - name: ""
      student_id: ""
      role: ""

architecture:
  diagram: "evidence/architecture.png"
  service_model: "Serverless managed services"
  deployment_model: "Public cloud"
  components:
    - "Amazon CloudFront"
    - "Amazon S3 private frontend origin"
    - "Amazon API Gateway HTTP API"
    - "AWS Lambda"
    - "Amazon Elastic Container Registry"
    - "Amazon CloudWatch Logs"

evidence:
  functional_test: "evidence/test-functional.md"
  security_test: "evidence/test-security.md"
  data_ai_test: "evidence/test-data-ai.md"
  scale_resilience_test: "evidence/test-resilience.md"
  monitoring: "evidence/monitoring.md"

data_ai:
  dataset: "data/README.md"
  method: "City-stratified price regression with log target transformation and histogram gradient boosting selected against median and ridge baselines"
  evaluation: "Held-out MAE 191.836, RMSE 629.762 and R-squared 0.644 in pooled local-currency units; log-price R-squared 0.850; see per-city metrics and limitations"
  reproducible_command: "python analytics/train_model.py --listings \"data/raw/Airbnb Data/Listings.csv\" --model-output analytics/artifacts/airbnb_price_model.joblib --metrics-output analytics/artifacts/model_evaluation.json"

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: "No credentials are stored in source or Terraform variables; deployment uses the standard AWS credential chain and Lambda IAM roles."

run:
  prerequisites:
    - "Python 3.11 or newer"
    - "Terraform 1.6 or newer"
    - "AWS credentials with permission to provision the declared resources"
  commands:
    - "python -m unittest discover -s tests -p test_*.py -v"
    - "cd src/infrastructure && terraform init -backend=false"
    - "cd src/infrastructure && terraform validate"
    - "cd src/infrastructure && terraform plan"

declarations:
  ai_use: "AI_USE_DECLARATION.md"
  contributions: "TEAM_CONTRIBUTIONS.md"
