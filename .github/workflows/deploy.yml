name: Deploy development

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to create or update AWS resources"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-deployment verification
    if: inputs.confirmation == 'DEPLOY' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nixon')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Run application verification
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m compileall -q analytics src/backend

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src/frontend -type f -name '*.js' -print)

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9 # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Validate Terraform without remote credentials
        working-directory: src/infrastructure
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  deploy:
    name: Terraform apply
    needs: verify
    if: inputs.confirmation == 'DEPLOY' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nixon')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Configure encrypted backend
        working-directory: src/infrastructure
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KMS_KEY_ARN"
          cat > backend.hcl <<EOF
          bucket       = "$TF_STATE_BUCKET"
          key          = "airbnb-market-intelligence/dev/terraform.tfstate"
          region       = "ap-southeast-1"
          encrypt      = true
          kms_key_id   = "$TF_STATE_KMS_KEY_ARN"
          use_lockfile = true
          EOF
          terraform init -input=false -backend-config=backend.hcl

      - name: Download evaluated model artifact
        env:
          MODEL_ARTIFACT_S3_URI: ${{ vars.MODEL_ARTIFACT_S3_URI }}
        run: |
          set -euo pipefail
          test -n "$MODEL_ARTIFACT_S3_URI"
          aws s3 cp "$MODEL_ARTIFACT_S3_URI" analytics/artifacts/airbnb_price_model.joblib

      - name: Create prediction image repository
        working-directory: src/infrastructure
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.prediction

      - name: Build and push immutable prediction image
        shell: bash
        run: |
          set -euo pipefail
          repository_url="$(terraform -chdir=src/infrastructure output -raw prediction_ecr_repository_url)"
          registry="${repository_url%%/*}"
          aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin "$registry"
          docker build --platform linux/amd64 --provenance=false -f src/backend/predict/Dockerfile -t "$repository_url:$GITHUB_SHA" .
          docker push "$repository_url:$GITHUB_SHA"

      - name: Plan deployment
        working-directory: src/infrastructure
        run: terraform plan -input=false -var="prediction_image_tag=$GITHUB_SHA" -out=deployment.tfplan

      - name: Apply reviewed plan
        working-directory: src/infrastructure
        run: terraform apply -input=false deployment.tfplan

      - name: Show public endpoints
        working-directory: src/infrastructure
        run: |
          terraform output frontend_url
          terraform output health_url
