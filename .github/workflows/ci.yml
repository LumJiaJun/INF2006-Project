name: CI

on:
  push:
    branches: [main, nixon]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python sources
        run: python -m compileall -q analytics src/backend

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src/frontend -type f -name '*.js' -print)

      - name: Reject committed credentials and account IDs
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(AKIA[0-9A-Z]{16}|arn:aws:[a-z0-9-]+:[^:]*:[0-9]{12}:|tfstate-[0-9]{12})' -- .; then
            echo 'Secret-like AWS identifiers must not be committed.' >&2
            exit 1
          fi

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive src/infrastructure

      - name: Validate application root
        working-directory: src/infrastructure
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate state bootstrap root
        working-directory: src/infrastructure/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
