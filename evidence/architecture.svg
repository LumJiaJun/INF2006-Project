<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150">
  <defs>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #10231e; }
      .subtitle { font: 18px Arial, sans-serif; fill: #60716b; }
      .step { font: 700 18px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .boundary { fill: #f7faf7; stroke: #91a69d; stroke-width: 2; stroke-dasharray: 10 8; }
      .boundary-label { font: 700 20px Arial, sans-serif; fill: #174f42; }
      .box { fill: #ffffff; stroke: #174f42; stroke-width: 2; rx: 16; }
      .edge { fill: #edf5ff; stroke: #2563eb; }
      .compute { fill: #fff4e9; stroke: #ea580c; }
      .data { fill: #eefaf3; stroke: #16945c; }
      .identity { fill: #f8f0ff; stroke: #8436bd; }
      .ops { fill: #fff9dd; stroke: #b17c00; }
      .network { fill: #edfafa; stroke: #008b8b; }
      .label { font: 700 19px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 15px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .tiny { font: 13px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .green-arrow { stroke: #16945c; stroke-width: 3; fill: none; marker-end: url(#greenhead); }
      .purple-arrow { stroke: #8436bd; stroke-width: 3; fill: none; marker-end: url(#purplehead); }
      .step-circle { fill: #e26345; stroke: #ffffff; stroke-width: 3; }
      .legend { font: 14px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#334155"/></marker>
    <marker id="greenhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16945c"/></marker>
    <marker id="purplehead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#8436bd"/></marker>
  </defs>

  <rect width="1800" height="1150" fill="#ffffff"/>
  <text x="70" y="58" class="title">INF2006 Airbnb Pricing and Market Intelligence Platform</text>
  <text x="70" y="90" class="subtitle">Current deployed serverless architecture | Region: ap-southeast-1 | Two-AZ Lambda VPC, WAF, CloudTrail, Cognito, and GitHub CI/CD</text>

  <rect x="45" y="130" width="250" height="790" class="boundary" rx="22"/>
  <text x="70" y="165" class="boundary-label">Public internet</text>
  <rect x="325" y="130" width="1430" height="790" class="boundary" rx="22"/>
  <text x="350" y="165" class="boundary-label">AWS account | ap-southeast-1</text>

  <circle cx="85" cy="245" r="24" class="step-circle"/><text x="85" y="252" class="step">1</text>
  <rect x="115" y="205" width="150" height="88" class="box"/>
  <text x="190" y="240" class="label">User browser</text><text x="190" y="266" class="small">HTTPS client</text>

  <circle cx="365" cy="245" r="24" class="step-circle"/><text x="365" y="252" class="step">2</text>
  <rect x="400" y="195" width="225" height="105" class="box edge"/>
  <text x="512" y="235" class="label">AWS WAF</text><text x="512" y="262" class="small">Managed rules + rate limit</text><text x="512" y="284" class="tiny">CloudFront protection</text>
  <rect x="400" y="335" width="225" height="92" class="box edge"/>
  <text x="512" y="372" class="label">CloudFront</text><text x="512" y="399" class="small">HTTPS edge + headers</text>
  <rect x="400" y="460" width="225" height="92" class="box data"/>
  <text x="512" y="497" class="label">Private S3 frontend</text><text x="512" y="524" class="small">OAC, public access blocked</text>

  <circle cx="690" cy="245" r="24" class="step-circle"/><text x="690" y="252" class="step">3</text>
  <rect x="725" y="195" width="235" height="105" class="box identity"/>
  <text x="842" y="235" class="label">Amazon Cognito</text><text x="842" y="262" class="small">Managed login + JWT</text><text x="842" y="284" class="tiny">Sign-up, verification, MFA</text>
  <rect x="725" y="335" width="235" height="92" class="box edge"/>
  <text x="842" y="372" class="label">API Gateway</text><text x="842" y="399" class="small">JWT, CORS, throttling</text>

  <circle cx="1025" cy="245" r="24" class="step-circle"/><text x="1025" y="252" class="step">4</text>
  <rect x="1060" y="180" width="355" height="480" class="boundary" rx="20"/>
  <text x="1085" y="212" class="boundary-label">VPC 10.20.0.0/16</text>
  <text x="1237" y="645" class="tiny">All functions attach to both subnets; AWS placement is not pinned to one AZ</text>
  <rect x="1085" y="235" width="145" height="385" class="network" rx="14"/>
  <text x="1157" y="267" class="label">Private AZ-a</text><text x="1157" y="290" class="tiny">10.20.1.0/24</text>
  <rect x="1100" y="320" width="115" height="95" class="box compute"/><text x="1157" y="357" class="label">Lambda</text><text x="1157" y="382" class="tiny">health / predict</text>
  <rect x="1100" y="450" width="115" height="95" class="box compute"/><text x="1157" y="487" class="label">Lambda</text><text x="1157" y="512" class="tiny">history / chat</text>
  <rect x="1245" y="235" width="145" height="385" class="network" rx="14"/>
  <text x="1317" y="267" class="label">Private AZ-b</text><text x="1317" y="290" class="tiny">10.20.2.0/24</text>
  <rect x="1260" y="320" width="115" height="95" class="box compute"/><text x="1317" y="357" class="label">Lambda</text><text x="1317" y="382" class="tiny">analytics</text>
  <rect x="1260" y="450" width="115" height="95" class="box network"/><text x="1317" y="487" class="label">Endpoints</text><text x="1317" y="512" class="tiny">no NAT gateway</text>

  <circle cx="1455" cy="245" r="24" class="step-circle"/><text x="1455" y="252" class="step">5</text>
  <rect x="1490" y="195" width="225" height="105" class="box network"/>
  <text x="1602" y="235" class="label">VPC endpoints</text><text x="1602" y="262" class="small">S3 + DynamoDB gateway</text><text x="1602" y="284" class="tiny">Logs, Athena, Bedrock interface</text>

  <circle cx="365" cy="690" r="24" class="step-circle"/><text x="365" y="697" class="step">6</text>
  <rect x="400" y="640" width="280" height="125" class="box data"/>
  <text x="540" y="680" class="label">Application records</text><text x="540" y="707" class="small">DynamoDB history + idempotency</text><text x="540" y="733" class="tiny">KMS encryption + PITR</text>
  <rect x="720" y="640" width="280" height="125" class="box data"/>
  <text x="860" y="680" class="label">Data lake</text><text x="860" y="707" class="small">S3 raw / processed / models</text><text x="860" y="733" class="tiny">Glue ETL + Parquet + Catalog</text>
  <rect x="1040" y="800" width="245" height="75" class="box identity"/>
  <text x="1162" y="832" class="label">Bedrock Claude Haiku</text><text x="1162" y="857" class="small">Bounded protected chat</text>
  <rect x="1325" y="640" width="195" height="125" class="box data"/>
  <text x="1422" y="680" class="label">Athena</text><text x="1422" y="707" class="small">Approved analytics SQL</text><text x="1422" y="733" class="tiny">No arbitrary user queries</text>

  <circle cx="1555" cy="690" r="24" class="step-circle"/><text x="1555" y="697" class="step">7</text>
  <rect x="1585" y="640" width="130" height="125" class="box ops"/>
  <text x="1650" y="680" class="label">CloudWatch</text><text x="1650" y="707" class="tiny">Logs, metrics</text><text x="1650" y="730" class="tiny">alarms + SNS</text>

  <rect x="325" y="950" width="1430" height="135" class="boundary" rx="20"/>
  <circle cx="365" cy="1018" r="24" class="step-circle"/><text x="365" y="1025" class="step">8</text>
  <rect x="405" y="980" width="270" height="75" class="box ops"/><text x="540" y="1012" class="label">GitHub Actions</text><text x="540" y="1038" class="small">SAST, DAST, tests, OIDC</text>
  <rect x="720" y="980" width="270" height="75" class="box ops"/><text x="855" y="1012" class="label">Terraform</text><text x="855" y="1038" class="small">Plan, review, apply</text>
  <rect x="1035" y="980" width="270" height="75" class="box ops"/><text x="1170" y="1012" class="label">ECR</text><text x="1170" y="1038" class="small">Prediction image scan</text>
  <rect x="1350" y="980" width="365" height="75" class="box ops"/><text x="1532" y="1012" class="label">CloudTrail</text><text x="1532" y="1038" class="small">Regional management events + validation</text>

  <path d="M265 250 L400 245" class="arrow"/><path d="M512 300 L512 335" class="arrow"/><path d="M512 427 L512 460" class="arrow"/>
  <path d="M625 380 L725 380" class="arrow"/><path d="M960 380 L1085 380" class="arrow"/>
  <path d="M960 395 L1100 500" class="arrow"/>
  <path d="M1215 370 L1260 370" class="arrow"/>
  <path d="M1390 500 L1490 250" class="green-arrow"/>
  <path d="M1157 545 L540 640" class="green-arrow"/><path d="M1317 545 L860 640" class="green-arrow"/>
  <path d="M1215 520 L1215 800" class="purple-arrow"/><path d="M1000 702 L1325 702" class="green-arrow"/>
  <path d="M1415 765 L1570 765" class="arrow"/>
  <path d="M675 1018 L720 1018" class="arrow"/><path d="M990 1018 L1035 1018" class="arrow"/><path d="M1305 1018 L1350 1018" class="arrow"/>

  <rect x="55" y="1020" width="220" height="90" class="box"/>
  <text x="165" y="1050" class="label">Legend</text><text x="165" y="1075" class="legend">Solid: request / telemetry</text><text x="165" y="1097" class="legend">Green: data flow</text>
</svg>
