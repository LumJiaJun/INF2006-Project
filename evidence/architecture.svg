  <path d="M500 365 L500 395" class="arrow"/>
  <path d="M500 495 L500 530" class="arrow"/>
  <path d="M635 445 L755 500" class="arrow"/>
  <path d="M915 380 L915 410" class="auth-arrow"/>
  <path d="M1075 525 L1220 610" class="arrow"/>
  <path d="M1380 535 L1330 465" class="arrow"/>
  <path d="M1600 535 L1650 465" class="arrow"/>
  <path d="M1760 610 L1905 370" class="data-arrow"/>
  <path d="M1760 640 L1905 585" class="data-arrow"/>
  <path d="M2075 585 L2110 585" class="data-arrow"/>
  <path d="M2195 635 L1990 670" class="data-arrow"/>
  <path d="M1760 660 L1905 720" class="data-arrow"/>
  <path d="M1760 680 L2110 720" class="data-arrow"/>
  <path d="M1220 650 L1020 820 L462 820 L462 920" class="ops-arrow"/>
  <path d="M560 980 L585 980" class="ops-arrow"/>
  <path d="M780 980 L805 980" class="ops-arrow"/>
  <path d="M1305 980 L1330 980" class="deploy-arrow"/>
  <path d="M1540 980 L1565 980" class="deploy-arrow"/>
  <path d="M1785 980 L1905 860" class="deploy-arrow"/>
</svg>
